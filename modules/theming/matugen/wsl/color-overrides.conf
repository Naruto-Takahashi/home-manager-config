# matugen 色オーバーライド
# =========================================================================
# matugenの自動抽出 (面積の多い色を優先) は、目立つが面積の小さい色
# (例: クッションの深緑) を拾えないことがある。気になる壁紙だけここに
# 手動で色を指定できる。`matugen-set-color <hex>` (現在の壁紙に対して
# 追記/更新) で編集するのが簡単。
#
# フォーマット: <壁紙ファイル名 (basename)>=<hex色>
# 例:
#   coffee.jpg=#2d5a3d
coffee.jpg=#2D5A3D
