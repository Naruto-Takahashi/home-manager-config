# 全構成が評価 (eval) できることを検証する。
# importパス切れ・構文エラー・オプションのtypoをpush時点で検出するのが目的。
# build ジョブは全構成を実際にビルドし、evalだけでは検出できない依存関係の
# 壊れ (atuinのような外部パッケージ内部実装への依存等) を検出する。atuinの
# TUIを自前パッチでビルドしていた頃は重かったが、パッチを撤廃しキャッシュが
# 効くようになったため常時実行にしている。
#
# build-linuxのnixosConfigurations.nixosビルド(カーネルモジュール等含む
# フルシステム)は変更が無くても毎回イチから作り直され重い。magic-nix-cache-
# action (2025年2月廃止・実質無効) → flakehub-cache-action と2度キャッシュ
# 導入を試みたが、後者は初回キャッシュアップロードだけでbuild-macが
# 24分→30分と大幅に悪化したため撤廃し、素の状態に戻した。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: nix flake check
        run: nix flake check --no-build
      - name: evaluate all homeConfigurations
        run: |
          nix eval '.#homeConfigurations."nalt-wsl".activationPackage.drvPath'
          nix eval '.#homeConfigurations."nalt-mac".activationPackage.drvPath'
      - name: evaluate nixosConfigurations
        run: nix eval '.#nixosConfigurations.nixos.config.system.build.toplevel.drvPath'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: shellcheck (zsh スクリプトは対象外)
        run: |
          git ls-files '*.sh' \
            | while read -r f; do head -1 "$f" | grep -q zsh || echo "$f"; done \
            | xargs nix run nixpkgs#shellcheck -- --severity=warning
      - name: starship fallback / template 同期チェック
        # 2ファイルは palettes.matugen ブロック以外同一に保つ規約
        # (docs/matugen-palette.md 参照)。コメント行を除いた本文を比較する。
        run: |
          strip() { awk '/^\[palettes\.matugen\]/{exit} !/^#/' "$1"; }
          if ! diff <(strip modules/shell/starship/starship.toml) \
                    <(strip modules/theming/matugen/templates/starship.toml); then
            echo "::error::starship.toml のフォールバック版とテンプレート版の内容が乖離しています"
            exit 1
          fi
      - name: ドキュメント内リンクの死活チェック
        # docs/*.md と README.md 内の相対リンク (Markdown [text](path) 形式) が
        # 実在ファイルを指しているかを検証する。リポジトリ構成変更 (ホスト削除等)
        # の際にドキュメント側の参照更新漏れを検出するのが目的。
        # #以降のアンカー、http(s)/mailto、`![](...)`のような記法説明用の
        # プレースホルダは対象外。
        run: |
          fail=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              path="${link%%#*}"
              [ -z "$path" ] && continue
              case "$path" in
                http://*|https://*|mailto:*|"...") continue ;;
              esac
              target="$dir/$path"
              if [ ! -e "$target" ]; then
                echo "::error file=$file::broken link -> $link"
                fail=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$file" | sed -E 's/^\]\((.*)\)$/\1/')
          done < <(git ls-files 'docs/*.md' README.md)
          exit $fail

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: build nalt-wsl
        run: nix build '.#homeConfigurations."nalt-wsl".activationPackage' --no-link
      - name: build nalt-distrobox
        run: nix build '.#homeConfigurations."nalt-distrobox".activationPackage' --no-link
      - name: build nixos
        run: nix build '.#nixosConfigurations.nixos.config.system.build.toplevel' --no-link

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: build nalt-mac
        run: nix build '.#homeConfigurations."nalt-mac".activationPackage' --no-link
